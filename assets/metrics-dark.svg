<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="100%">
  <defs>
    <linearGradient id="mCardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0B0F17" />
    </linearGradient>
    <linearGradient id="statCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="statIndigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="statEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="statAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Card 1 -->
  <g transform="translate(0, 0)">
    <rect width="214" height="110" rx="10" fill="url(#mCardBg)" stroke="#1E293B" stroke-width="1.2" />
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="700" fill="#38BDF8" letter-spacing="1">DATA &amp; ETL RECONCILIATION</text>
    <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#statCyan)" letter-spacing="-0.5">300,000+</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Orders &amp; Customers</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Zero data loss · Zero SEO drop</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(228, 0)">
    <rect width="214" height="110" rx="10" fill="url(#mCardBg)" stroke="#1E293B" stroke-width="1.2" />
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="700" fill="#818CF8" letter-spacing="1">SHOPIFY → MEDUSA.JS</text>
    <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#statIndigo)" letter-spacing="-0.5">Zero-Drop</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Headless Migrations</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748B">D2C &amp; Wholesale · Self-Hosted &amp; Cloud</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(456, 0)">
    <rect width="214" height="110" rx="10" fill="url(#mCardBg)" stroke="#1E293B" stroke-width="1.2" />
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="700" fill="#34D399" letter-spacing="1">CLOUD &amp; DISTRIBUTED</text>
    <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#statEmerald)" letter-spacing="-0.5">AWS &amp; GCP</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">Event-Driven Systems</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" fill="#64748B">Terraform · Docker · BullMQ · Redis</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(684, 0)">
    <rect width="216" height="110" rx="10" fill="url(#mCardBg)" stroke="#1E293B" stroke-width="1.2" />
    <text x="16" y="26" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" font-weight="700" fill="#FBBF24" letter-spacing="1">ACQUISITION EXIT</text>
    <text x="16" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="url(#statAmber)" letter-spacing="-0.5">1,000+ DAU</text>
    <text x="16" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F8FAFC">TMAIL.PK Platform</text>
    <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Acquired by Quamify (Mar 2026)</text>
  </g>
</svg>